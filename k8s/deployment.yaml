apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-profile-analyzer
  labels:
    app: github-profile-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-profile-analyzer
  template:
    metadata:
      labels:
        app: github-profile-analyzer
    spec:
      containers:
        - name: github-profile-analyzer
          image: github-profile-analyzer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: github-profile-analyzer
spec:
  type: NodePort
  selector:
    app: github-profile-analyzer
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
